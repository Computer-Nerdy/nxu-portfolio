name: '3D WebGL Portfolio & Hardware Telemetry Engine'
description: 'Production-ready 3D WebGL portfolio with Three.js ESP32 stage, video reel & kinetic typography'
author: 'Harish Ragav V. (Computer-Nerdy)'
branding:
  icon: 'cpu'
  color: 'orange'

inputs:
  build-path:
    description: 'Output path'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Verify WebGL & Asset Integrity
      shell: bash
      run: |
        echo "⚡ Initializing 3D WebGL Portfolio Action Engine..."
        test -f index.html || exit 1
        echo "✅ Verified successfully!"
